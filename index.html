e="false" type="button">Fattest pool</button><button class="tab shrink-0" data-active="false" type="button">Jackpots</button><button class="tab shrink-0" data-active="false" type="button">New</button><button class="tab shrink-0" data-active="false" type="button">Graduated</button></div><div class="flex gap-2"><input class="field h-[40px] md:w-[300px]" placeholder="Search name, ticker or CA" value=""/><div class="tabs shrink-0"><button class="tab capitalize" data-active="true" type="button">grid</button><button class="tab capitalize" data-active="false" type="button">list</button></div></div></div><div class="card p-12 text-center text-muted">No coins yet. <a class="text-ink underline" href="#/launch">Launch one.</a></div></div></main></template><template id="page-blasts"><main class="flex-1"><div class="mx-auto max-w-[1100px] px-4 pt-12 pb-8 sm:px-5 sm:pt-16"><div class="flex flex-col justify-between gap-5 pb-8 md:flex-row md:items-end"><div><p class="eyebrow">your payouts</p><h1 class="h-display mt-3 text-[38px] sm:text-[52px]">Get <span class="fire-text">blasted</span> back</h1><p class="mt-4 max-w-[580px] text-[13.5px] text-muted">Payouts land in your wallet on their own every blast. This is where you see how much, from which bags, and how close each one is to being made whole.</p></div></div><div class="card flex flex-col items-center px-6 py-16 text-center"><h2 class="h-display mt-6 text-[36px]">Connect to see your blasts</h2><p class="mt-2 max-w-md text-muted">We read your bags across every REBQUO coin and show what each blast paid you. Nothing to sign, nothing to claim.</p><button class="btn btn-blast mt-6 px-7" type="button">Connect wallet</button></div></div></main></template><template id="page-leaderboard"><main class="flex-1"><div class="mx-auto max-w-[1100px] px-4 pt-12 pb-8 sm:px-5 sm:pt-16"><div class="flex flex-col justify-between gap-5 pb-8 md:flex-row md:items-end"><div><p class="eyebrow">hall of tops</p><h1 class="h-display mt-3 text-[38px] sm:text-[52px]">Leaderboard</h1><p class="mt-4 max-w-[580px] text-[13.5px] text-muted">The wallets that bought the hardest tops, the ones REBQUO has paid back the most, and the coins paying their top blasters hardest.</p></div></div><div class="grid gap-5 lg:grid-cols-2"><section class="card"><div class="flex items-center justify-between border-b border-edge px-5 py-4"><h2 class="h-display text-[22px]">Hall of tops</h2><span class="chip chip-down">right now</span></div><div class="ledger-row eyebrow grid-cols-[28px_1.3fr_0.8fr_0.8fr_1fr] !border-0 !text-[11px]"><span>#</span><span>Wallet</span><span>Coin</span><span>Of top</span><span class="text-right">Red</span></div><p class="border-t border-edge px-5 py-10 text-center text-[13px] text-muted">Nobody’s holding a red top. Yet.</p></section><section class="card"><div class="flex items-center justify-between border-b border-edge px-5 py-4"><h2 class="h-display text-[22px]">Most paid back</h2><span class="chip chip-up">all time</span></div><div class="ledger-row eyebrow grid-cols-[28px_1.4fr_1fr_0.7fr_1fr] !border-0 !text-[11px]"><span>#</span><span>Wallet</span><span>Coins</span><span>Jackpots</span><span class="text-right">Paid</span></div><p class="border-t border-edge px-5 py-10 text-center text-[13px] text-muted">Empty until the first blast pays someone.</p></section></div><div class="mt-5 grid gap-5 lg:grid-cols-[1fr_1.2fr]"><section class="card"><div class="border-b border-edge px-5 py-4"><h2 class="h-display text-[22px]">Coins paying the hardest</h2></div><p class="px-5 py-10 text-center text-[13px] text-muted">No live coins yet.</p></section><section class="card"><div class="flex items-center gap-2.5 border-b border-edge px-5 py-4"><span class="live-dot"></span><h2 class="h-display text-[22px]">Live activity</h2></div><p class="px-4 py-6 text-[12.5px] text-dim">Nothing yet. The first blast shows up here.</p></section></div></div></main></template><template id="page-docs"><main class="flex-1"><div class="mx-auto max-w-[1100px] px-4 pt-12 pb-8 sm:px-5 sm:pt-16"><div class="flex flex-col justify-between gap-5 pb-8 md:flex-row md:items-end"><div><p class="eyebrow">how it works</p><h1 class="h-display mt-3 text-[38px] sm:text-[52px]">Docs</h1><p class="mt-4 max-w-[580px] text-[13.5px] text-muted">Where every lamport of the creator fee goes, how a top blast is weighed, how the jackpot is drawn, and why it's hard to game.</p></div></div><div class="grid gap-8 lg:grid-cols-[220px_1fr]"><nav class="hidden lg:block"><div class="sticky top-[96px] max-h-[calc(100vh-120px)] space-y-5 overflow-y-auto pb-6 text-[13px]"><div><p class="eyebrow px-3 pb-1.5">Basics</p><ul><li><a class="block px-3 py-1 text-muted transition-colors hover:bg-raised hover:text-ink" href="#what">What REBQUO is</a></li><li><a class="block px-3 py-1 text-muted transition-colors hover:bg-raised hover:text-ink" href="#fees">Where the fees go</a></li></ul></div><div><p class="eyebrow px-3 pb-1.5">The blast</p><ul><li><a class="block px-3 py-1 text-muted transition-colors hover:bg-raised hover:text-ink" href="#red">Who counts as red</a></li><li><a class="block px-3 py-1 text-muted transition-colors hover:bg-raised hover:text-ink" href="#top">The top multiplier</a></li><li><a class="block px-3 py-1 text-muted transition-colors hover:bg-raised hover:text-ink" href="#split">How a blast is split</a></li><li><a class="block px-3 py-1 text-muted transition-colors hover:bg-raised hover:text-ink" href="#trades">Which trades count</a></li></ul></div><div><p class="eyebrow px-3 pb-1.5 !text-blast">Top Tick Jackpot</p><ul><li><a class="block px-3 py-1 text-muted transition-colors hover:bg-raised hover:text-ink" href="#jackpot">How the draw works</a></li></ul></div><div><p class="eyebrow px-3 pb-1.5">Reference</p><ul><li><a class="block px-3 py-1 text-muted transition-colors hover:bg-raised hover:text-ink" href="#website">Coin websites</a></li><li><a class="block px-3 py-1 text-muted transition-colors hover:bg-raised hover:text-ink" href="#limits">What it isn't</a></li><li><a class="block px-3 py-1 text-muted transition-colors hover:bg-raised hover:text-ink" href="#glossary">Glossary</a></li></ul></div></div></nav><div class="flex max-w-[780px] min-w-0 flex-col gap-5"><div class="flex flex-col gap-5"><p class="eyebrow pt-4 first:pt-0">Basics</p><section class="scroll-mt-28 p-6 sm:p-8 card" id="what"><h2 class="h-display relative text-[32px]">What REBQUO is</h2><div class="relative mt-4 space-y-3 text-[14px] leading-relaxed text-muted [&amp;_b]:font-semibold [&amp;_b]:text-ink"><p>A Solana launchpad on pump.fun rails where the creator fees of every coin go back to the people who bought the top. Every 10 minutes, 90% of what a coin earned is split between the holders who are in the red, weighted by <b>how much they’re down</b> and <b>how close to the all-time high they bought</b>.</p><p>Payouts stop at your loss. A wallet in profit gets nothing. It isn’t yield, it’s a refund that drips for as long as the coin trades.</p></div></section><section class="scroll-mt-28 p-6 sm:p-8 card" id="fees"><h2 class="h-display relative text-[32px]">Where the fees go</h2><div class="relative mt-4 space-y-3 text-[14px] leading-relaxed text-muted [&amp;_b]:font-semibold [&amp;_b]:text-ink"><p>Every REBQUO coin is created on pump.fun with the REBQUO fee vault as its creator. pump.fun pays the creator fee on every trade, on the bonding curve and after graduation, so all of it lands in the vault. Nobody can change that after mint, including the dev and us.</p><p>Every blast the engine claims what the vault is owed, splits it between coins by the volume each one did since the last blast, then splits each coin’s share:</p><div class="my-4 overflow-x-auto border border-edge-hi"><table class="ledger min-w-[520px] text-[13px]"><thead><tr><th>Pool</th><th>Share</th><th>Goes to</th></tr></thead><tbody><tr><td class="!text-ink">Blast pool</td><td class="">80%</td><td class="">Top blasters still in the red, by loss × top multiplier, every 10 min</td></tr><tr><td class="!text-ink">Top Tick Jackpot</td><td class="">10%</td><td class="">One red wallet wins the whole pot every 60 min, odds by blast weight</td></tr><tr><td class="!text-ink">$REBQUO buyback</td><td class="">10%</td><td class="">Sent to the buyback wallet to buy and burn $REBQUO</td></tr></tbody></table></div><p>Without the jackpot, its 10% stays in the blast pool, so the pool gets 90%. The buyback share is sent to the buyback wallet every blast.</p></div></section></div><div class="flex flex-col gap-5"><p class="eyebrow pt-4 first:pt-0">The blast</p><section class="scroll-mt-28 p-6 sm:p-8 card" id="red"><h2 class="h-display relative text-[32px]">Who counts as red</h2><div class="relative mt-4 space-y-3 text-[14px] leading-relaxed text-muted [&amp;_b]:font-semibold [&amp;_b]:text-ink"><p>Your loss is your PnL on the coin, after counting everything REBQUO already paid you:</p><pre class="inset num my-4 overflow-x-auto p-4 text-[12.5px] leading-relaxed text-ink">loss = cost of counted tokens − value of counted tokens − already paid back

counted tokens = min(balance now, tokens you bought yourself, lowest balance this epoch)</pre><p>You need at least <b>100,000</b> counted tokens. Tokens bought during an epoch count from the next one, so buying a second before a blast does nothing. Tokens someone sends you have no cost and never add a loss. Tokens you send away take their share of your cost with them.</p></div></section><section class="scroll-mt-28 p-6 sm:p-8 card" id="top"><h2 class="h-display relative text-[32px]">The top multiplier</h2><div class="relative mt-4 space-y-3 text-[14px] leading-relaxed text-muted [&amp;_b]:font-semibold [&amp;_b]:text-ink"><p>This is the part that makes it REBQUO. The closer to the top you bought, the more each lost SOL counts:</p><pre class="inset num my-4 overflow-x-auto p-4 text-[12.5px] leading-relaxed text-ink">topness   = your average entry price ÷ the coin's all-time high     (0 to 1)
top mult  = 1 + 1 × topness²
weight    = loss × top mult</pre><div class="my-4 overflow-x-auto border border-edge-hi"><table class="ledger min-w-[520px] text-[13px]"><thead><tr><th>Bought at</th><th>Top multiplier</th></tr></thead><tbody><tr><td class="!text-ink">25% of the ATH</td><td class="">1.06×</td></tr><tr><td class="!text-ink">50% of the ATH</td><td class="">1.25×</td></tr><tr><td class="!text-ink">75% of the ATH</td><td class="">1.56×</td></tr><tr><td class="!text-ink">90% of the ATH</td><td class="">1.81×</td></tr><tr><td class="!text-ink">100% of the ATH</td><td class="">2.00×</td></tr></tbody></table></div><p>It’s squared on purpose: a bag bought at 95% of the ATH counts far more than one bought halfway up. The ATH is the highest price the engine has seen the coin trade at.</p></div></section><section class="scroll-mt-28 p-6 sm:p-8 card" id="split"><h2 class="h-display relative text-[32px]">How a blast is split</h2><div class="relative mt-4 space-y-3 text-[14px] leading-relaxed text-muted [&amp;_b]:font-semibold [&amp;_b]:text-ink"><p>The pool is split pro rata by weight, then two caps apply:</p><pre class="inset num my-4 overflow-x-auto p-4 text-[12.5px] leading-relaxed text-ink">your payout = min( pool × your weight ÷ total weight,
                   pool × 5%,
                   your unrepaid loss )</pre><p>Anything a cap holds back stays in the pool for the next blast. Payouts under 0.0005 SOL roll over too, so dust isn’t sent. A worked example, with a 1 SOL pool:</p><div class="my-4 overflow-x-auto border border-edge-hi"><table class="ledger min-w-[520px] text-[13px]"><thead><tr><th>Wallet</th><th>Loss</th><th>Top ×</th><th>Weight</th><th>Payout</th></tr></thead><tbody><tr><td class="!text-ink">A · bought the top tick</td><td class="">2.10</td><td class="">1.96</td><td class="">62.7%</td><td class="">+0.0500</td></tr><tr><td class="!text-ink">B · bought mid-chart</td><td class="">1.50</td><td class="">1.25</td><td class="">28.6%</td><td class="">+0.0500</td></tr><tr><td class="!text-ink">C · small top bag</td><td class="">0.30</td><td class="">1.90</td><td class="">8.7%</td><td class="">+0.0500</td></tr><tr><td class="!text-ink">D · early, in profit</td><td class="">0.00</td><td class="">1.01</td><td class="">0.0%</td><td class="">0</td></tr></tbody></table></div><p>A lost the same SOL as B but bought at the top, so A gets more. C is small but bought the top, so C still gets a real cut. D is in profit and gets nothing. Whatever the 5% cap held back rolls over.</p></div></section><section class="scroll-mt-28 p-6 sm:p-8 card" id="trades"><h2 class="h-display relative text-[32px]">Which trades count</h2><div class="relative mt-4 space-y-3 text-[14px] leading-relaxed text-muted [&amp;_b]:font-semibold [&amp;_b]:text-ink"><p>The engine reads every transaction on the coin’s bonding curve, and on its pump.fun pool after graduation, straight from chain. It doesn’t matter where you traded: here, pump.fun, or any terminal.</p><p>A trade counts for the wallet that signed it, and only if that wallet is the <b>only</b> signer. A transaction with a second signer is ignored, so nobody can sign tokens or SOL into a bag from another wallet to fake a loss. Before each payout the biggest red bags are also checked against their real on-chain balance.</p></div></section></div><div class="flex flex-col gap-5"><p class="eyebrow pt-4 first:pt-0 !text-blast">Top Tick Jackpot</p><section class="scroll-mt-28 p-6 sm:p-8 jackpot" data-on="true" id="jackpot"><h2 class="h-display relative text-[32px] fire-text">Top Tick Jackpot</h2><div class="relative mt-4 space-y-3 text-[14px] leading-relaxed text-muted [&amp;_b]:font-semibold [&amp;_b]:text-ink"><p>The one choice a dev makes at launch, locked in at mint. 10% of the coin’s fees go into a pot instead of the blast pool. Every 60 minutes, one red wallet wins the whole pot.</p><p>Your odds are your share of the coin’s blast weight, so the deepest bags bought nearest the top have the best shot. A win is capped at the winner’s unrepaid loss, and anything left stays in the pot for the next draw. If nobody is red, the pot rolls over.</p><p>The draw is made by the engine with a cryptographic random number. Every win is paid on-chain and linked in the live feed.</p></div></section></div><div class="flex flex-col gap-5"><p class="eyebrow pt-4 first:pt-0">Reference</p><section class="scroll-mt-28 p-6 sm:p-8 card" id="website"><h2 class="h-display relative text-[32px]">Coin websites</h2><div class="relative mt-4 space-y-3 text-[14px] leading-relaxed text-muted [&amp;_b]:font-semibold [&amp;_b]:text-ink"><p>Every coin’s metadata points its website at <b>useREBQUOed.fun/coin/&lt;mint&gt;</b>, written at mint. That page shows the live chart, the pool, every red holder and what they’re owed. A dev can’t swap it for a link that goes somewhere else.</p></div></section><section class="scroll-mt-28 p-6 sm:p-8 card" id="limits"><h2 class="h-display relative text-[32px]">What it isn't</h2><div class="relative mt-4 space-y-3 text-[14px] leading-relaxed text-muted [&amp;_b]:font-semibold [&amp;_b]:text-ink"><p><b>Not a guarantee.</b> Payouts are a share of real fees. A coin with no volume pays nothing.</p><p><b>Not yield.</b> Nobody is ever paid more than they lost, and wallets in profit are never paid.</p><p><b>Not a reason to buy.</b> Buying the top on purpose is, at best, a slow way to break even.</p></div></section><section class="scroll-mt-28 p-6 sm:p-8 card" id="glossary"><h2 class="h-display relative text-[32px]">Glossary</h2><div class="relative mt-4 space-y-3 text-[14px] leading-relaxed text-muted [&amp;_b]:font-semibold [&amp;_b]:text-ink"><dl class="grid grid-cols-[130px_1fr] gap-x-4 gap-y-2"><div class="contents"><dt class="text-ink">Top blaster</dt><dd>A holder in the red, especially one who bought near the ATH.</dd></div><div class="contents"><dt class="text-ink">Blast</dt><dd>One payout round, every 10 minutes.</dd></div><div class="contents"><dt class="text-ink">Blast pool</dt><dd>A coin's share of fees waiting for the next blast.</dd></div><div class="contents"><dt class="text-ink">Topness</dt><dd>Your average entry as a share of the ATH.</dd></div><div class="contents"><dt class="text-ink">Top multiplier</dt><dd>1× to 2×, from your topness.</dd></div><div class="contents"><dt class="text-ink">Made whole</dt><dd>Your loss is fully paid back. The bag drops out of payouts.</dd></div><div class="contents"><dt class="text-ink">Jackpot</dt><dd>The optional Top Tick Jackpot, one red winner per draw.</dd></div></dl></div></section></div><div class="flex flex-wrap gap-3 pt-2"><a class="btn btn-blast" href="#/launch">Launch a coin</a><a class="btn btn-line" href="#/blasts">Check your blasts</a></div></div></div></div></main></template><script>(()=>{'use strict';const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];let cleanup=()=>{};
